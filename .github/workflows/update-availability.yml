name: Update Availability from Planning Beats

# Runs daily at 06:00 UTC.
# Can also be triggered manually from the Actions tab.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit availability.json back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Run availability update
        run: npm run update-availability
        env:
          PLANNING_BEATS_ICAL_URL: ${{ secrets.PLANNING_BEATS_ICAL_URL }}

      - name: Commit updated availability data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add availability.json
          # Only commit if something actually changed
          if git diff --staged --quiet; then
            echo "No changes to availability data — nothing to commit."
          else
            git commit -m "chore: update availability from Planning Beats calendar [skip ci]"
            git push
          fi
