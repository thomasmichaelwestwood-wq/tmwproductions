[build]
  # No build command needed for a static HTML site.
  # Netlify will auto-detect and install dependencies from package.json.
  publish = "."
  functions = "netlify/functions"

# Expose functions at the friendlier /api/... path.
[[redirects]]
  from   = "/api/enquiry-webhook"
  to     = "/.netlify/functions/enquiry-webhook"
  status = 200

[[redirects]]
  from   = "/api/jotform-webhook"
  to     = "/.netlify/functions/jotform-webhook"
  status = 200

[[redirects]]
  from   = "/api/check-availability"
  to     = "/.netlify/functions/check-availability"
  status = 200

[[redirects]]
  from   = "/date"
  to     = "/date.html"
  status = 200

[functions]
  # Bundle each function with its node_modules using esbuild.
  node_bundler = "esbuild"
[[redirects]]
  from   = "/availability.json"
  to     = "/.netlify/functions/check-availability?mode=percentages"
  status = 200
  force  = true
