<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery Upload — Hair with Faith Peel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream:    #faf6f1;
      --warm:     #f3ebe0;
      --parchment:#e8ddd0;
      --espresso: #2a1a0e;
      --caramel:  #9c6840;
      --muted:    #7a6254;
      --stone:    #c4b4a4;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; -webkit-text-size-adjust: 100%; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--espresso);
      min-height: 100dvh;
      padding: 1.75rem 1.25rem;
      padding-bottom: max(2rem, env(safe-area-inset-bottom, 2rem));
      max-width: 480px;
      margin: 0 auto;
    }

    .logo {
      display: block;
      height: 34px;
      width: auto;
      margin: 0 auto 2.5rem;
    }

    /* ─── PIN screen ─── */
    .pin-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 60dvh;
      justify-content: center;
      gap: 1.25rem;
      text-align: center;
    }

    .pin-screen h1 {
      font-size: 1.375rem;
      font-weight: 500;
    }

    .pin-screen p {
      color: var(--muted);
      font-size: 0.9375rem;
    }

    .pin-input {
      width: 160px;
      font-size: 1.75rem;
      letter-spacing: 0.4rem;
      text-align: center;
      border: 2px solid var(--stone);
      border-radius: 14px;
      padding: 0.75rem 1rem;
      background: white;
      color: var(--espresso);
      outline: none;
      transition: border-color 0.2s;
      -webkit-appearance: none;
    }

    .pin-input:focus { border-color: var(--espresso); }

    .pin-error {
      color: #b71c1c;
      font-size: 0.875rem;
      min-height: 1.25rem;
    }

    /* ─── Upload screen ─── */
    .upload-screen { display: none; }
    .upload-screen.visible { display: block; }

    .upload-screen h1 {
      font-size: 1.5rem;
      font-weight: 500;
      margin-bottom: 0.25rem;
    }

    .upload-sub {
      color: var(--muted);
      font-size: 0.9375rem;
      margin-bottom: 2rem;
    }

    /* ─── Photo picker ─── */
    .photo-pick {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      width: 100%;
      aspect-ratio: 1;
      max-height: 320px;
      border: 2px dashed var(--stone);
      border-radius: 20px;
      background: var(--warm);
      cursor: pointer;
      position: relative;
      overflow: hidden;
      margin-bottom: 1.5rem;
      -webkit-tap-highlight-color: transparent;
    }

    .photo-pick__preview {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .photo-pick__label {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.625rem;
      color: var(--muted);
      font-size: 0.9375rem;
      pointer-events: none;
    }

    .photo-pick__label svg { opacity: 0.55; }

    .photo-pick input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      /* Large font-size prevents iOS auto-zoom on focus */
      font-size: 64px;
    }

    /* ─── Fields ─── */
    .field { margin-bottom: 1.25rem; }

    .field label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 0.375rem;
    }

    .field input {
      width: 100%;
      font-family: inherit;
      font-size: 1rem;
      padding: 0.875rem 1rem;
      border: 1.5px solid var(--stone);
      border-radius: 12px;
      background: white;
      color: var(--espresso);
      outline: none;
      transition: border-color 0.2s;
      -webkit-appearance: none;
    }

    .field input:focus { border-color: var(--espresso); }
    .field .hint {
      font-size: 0.8125rem;
      color: var(--stone);
      margin-top: 0.375rem;
    }

    /* ─── Upload button ─── */
    .btn-upload {
      display: block;
      width: 100%;
      padding: 1rem;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 500;
      background: var(--espresso);
      color: var(--cream);
      border: none;
      border-radius: 14px;
      cursor: pointer;
      min-height: 54px;
      transition: opacity 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-upload:disabled { opacity: 0.4; cursor: default; }

    /* ─── Progress bar ─── */
    .progress-wrap {
      display: none;
      height: 4px;
      background: var(--parchment);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 1rem;
    }

    .progress-bar {
      height: 100%;
      background: var(--espresso);
      width: 0;
      transition: width 0.3s ease;
    }

    /* ─── Status messages ─── */
    .status {
      display: none;
      margin-top: 1.25rem;
      padding: 1rem 1.125rem;
      border-radius: 12px;
      font-size: 0.9375rem;
      line-height: 1.5;
    }

    .status--ok  { background: #e8f5e9; color: #1b5e20; }
    .status--err { background: #fdecea; color: #b71c1c; }

    .btn-again {
      display: inline-block;
      margin-top: 0.875rem;
      padding: 0.5rem 1rem;
      border: 1.5px solid currentColor;
      border-radius: 8px;
      background: transparent;
      font-family: inherit;
      font-size: 0.875rem;
      color: inherit;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <img
    src="https://res.cloudinary.com/dfaebplzd/image/upload/q_auto,f_auto/v1782028578/Hair-with-Faith-Peel-transparent_ldxuvs.png"
    alt="Hair with Faith Peel"
    class="logo"
  >

  <!-- ─── PIN screen ─── -->
  <div class="pin-screen" id="pin-screen">
    <div>
      <h1>Gallery upload</h1>
      <p style="margin-top:0.5rem">Enter your PIN to continue</p>
    </div>
    <input
      class="pin-input"
      id="pin-input"
      type="password"
      inputmode="numeric"
      maxlength="6"
      placeholder="••••"
      autocomplete="off"
    >
    <p class="pin-error" id="pin-error"></p>
  </div>

  <!-- ─── Upload screen ─── -->
  <div class="upload-screen" id="upload-screen">
    <h1>Add to gallery</h1>
    <p class="upload-sub">Choose a photo and add a short description</p>

    <!-- Photo picker -->
    <div class="photo-pick" id="photo-pick">
      <img class="photo-pick__preview" id="preview-img" alt="">
      <div class="photo-pick__label" id="pick-label">
        <svg width="44" height="44" viewBox="0 0 44 44" fill="none">
          <rect x="3" y="8" width="38" height="28" rx="5" stroke="currentColor" stroke-width="2"/>
          <circle cx="22" cy="22" r="7.5" stroke="currentColor" stroke-width="2"/>
          <circle cx="22" cy="22" r="3" fill="currentColor"/>
          <path d="M15.5 8l2.5-5h8l2.5 5" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        </svg>
        <span>Tap to choose photo</span>
      </div>
      <input type="file" id="file-input" accept="image/*">
    </div>

    <!-- Description -->
    <div class="field">
      <label for="description">Description</label>
      <input
        type="text"
        id="description"
        placeholder="e.g. Balayage with toner — July 2025"
        maxlength="120"
      >
      <p class="hint">Keep it short — shown below the photo on the site</p>
    </div>

    <button class="btn-upload" id="upload-btn" disabled>Add to gallery</button>

    <div class="progress-wrap" id="progress-wrap">
      <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div class="status status--ok" id="msg-ok">
      Photo added to gallery!
      <br>
      <button class="btn-again" onclick="resetForm()">Add another photo</button>
    </div>

    <div class="status status--err" id="msg-err"></div>
  </div>

  <!-- Hidden form — Netlify detects this at deploy time and creates the form -->
  <form name="gallery-upload" data-netlify="true" style="display:none">
    <input type="hidden" name="image_url">
    <input type="hidden" name="description">
  </form>

  <script>
    /* ─── Config — set these before deploying ──────────────────────
       PIN:              only Faith knows this; change from default!
       CLOUDINARY_PRESET: create an unsigned upload preset in Cloudinary:
                         Settings → Upload → Upload presets → Add preset
                         Set "Signing mode" = Unsigned, folder = faith-peel/gallery
    ────────────────────────────────────────────────────────────── */
    var PIN               = '1234';            /* CHANGE THIS */
    var CLOUDINARY_CLOUD  = 'dfaebplzd';
    var CLOUDINARY_PRESET = 'REPLACE_WITH_PRESET'; /* CHANGE THIS */

    /* ─── PIN check ─────────────────────────────────────────────── */
    if (sessionStorage.getItem('fp_auth') === '1') showUpload();

    var pinInput = document.getElementById('pin-input');
    var pinError = document.getElementById('pin-error');

    pinInput.addEventListener('input', function () {
      var val = pinInput.value;
      if (val.length < PIN.length) return;
      if (val === PIN) {
        sessionStorage.setItem('fp_auth', '1');
        showUpload();
      } else {
        pinError.textContent = 'Incorrect PIN — try again';
        pinInput.value = '';
      }
    });

    function showUpload() {
      document.getElementById('pin-screen').style.display  = 'none';
      document.getElementById('upload-screen').classList.add('visible');
    }

    /* ─── File selection → preview ──────────────────────────────── */
    var selectedFile = null;

    document.getElementById('file-input').addEventListener('change', function (e) {
      var file = e.target.files[0];
      if (!file) return;
      selectedFile = file;
      var reader = new FileReader();
      reader.onload = function (ev) {
        var img = document.getElementById('preview-img');
        img.src = ev.target.result;
        img.style.display = 'block';
        document.getElementById('pick-label').style.display = 'none';
      };
      reader.readAsDataURL(file);
      checkReady();
    });

    document.getElementById('description').addEventListener('input', checkReady);

    function checkReady() {
      var ready = selectedFile && document.getElementById('description').value.trim().length > 0;
      document.getElementById('upload-btn').disabled = !ready;
    }

    /* ─── Upload flow ───────────────────────────────────────────── */
    document.getElementById('upload-btn').addEventListener('click', function () {
      if (!selectedFile) return;

      var description  = document.getElementById('description').value.trim();
      var btn          = document.getElementById('upload-btn');
      var progressWrap = document.getElementById('progress-wrap');
      var progressBar  = document.getElementById('progress-bar');

      if (CLOUDINARY_PRESET === 'REPLACE_WITH_PRESET') {
        showError('Cloudinary upload preset not set — see setup notes in upload.html.');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Uploading…';
      progressWrap.style.display = 'block';
      progressBar.style.width = '15%';
      hide('msg-ok'); hide('msg-err');

      /* Step 1: upload photo to Cloudinary */
      var fd = new FormData();
      fd.append('file', selectedFile);
      fd.append('upload_preset', CLOUDINARY_PRESET);
      fd.append('folder', 'faith-peel/gallery');

      fetch('https://api.cloudinary.com/v1_1/' + CLOUDINARY_CLOUD + '/image/upload', {
        method: 'POST',
        body: fd,
      })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (!data.secure_url) throw new Error('Cloudinary upload failed');
        progressBar.style.width = '70%';

        /* Step 2: record in Netlify Forms (image URL + description) */
        return fetch('/upload.html', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: 'form-name=gallery-upload' +
                '&image_url=' + encodeURIComponent(data.secure_url) +
                '&description=' + encodeURIComponent(description),
        });
      })
      .then(function () {
        progressBar.style.width = '100%';
        setTimeout(function () {
          progressWrap.style.display = 'none';
          document.getElementById('msg-ok').style.display = 'block';
          btn.textContent = 'Add to gallery';
        }, 400);
      })
      .catch(function (err) {
        showError('Something went wrong — check your connection and try again.');
        console.error(err);
      });
    });

    function showError(msg) {
      var el = document.getElementById('msg-err');
      el.textContent = msg;
      el.style.display = 'block';
      document.getElementById('progress-wrap').style.display = 'none';
      var btn = document.getElementById('upload-btn');
      btn.disabled = false;
      btn.textContent = 'Add to gallery';
    }

    function hide(id) { document.getElementById(id).style.display = 'none'; }

    function resetForm() {
      selectedFile = null;
      document.getElementById('file-input').value = '';
      document.getElementById('preview-img').style.display = 'none';
      document.getElementById('pick-label').style.display  = 'flex';
      document.getElementById('description').value = '';
      document.getElementById('msg-ok').style.display = 'none';
      document.getElementById('upload-btn').disabled = true;
    }
  </script>

</body>
</html>
